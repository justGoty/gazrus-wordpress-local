name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Deploy verified master revision
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          SSHPASS: ${{ secrets.PRODUCTION_PASSWORD }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "SSH deployment attempt ${attempt}/3"
            if timeout 660s sshpass -e ssh \
              -o ConnectTimeout=25 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=accept-new \
              "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -se' <<'REMOTE'
                cd /opt/gazrus-next
                git fetch origin master
                git pull --ff-only origin master
                docker compose -f deploy/docker-compose.production.yml up -d --build

                health=""
                for index in $(seq 1 36); do
                  health=$(docker inspect --format='{{.State.Health.Status}}' gazrus-next 2>/dev/null || true)
                  echo "health=${health}"
                  if [ "${health}" = "healthy" ]; then
                    break
                  fi
                  sleep 5
                done

                test "${health}" = "healthy"
                echo "revision=$(git rev-parse HEAD)"
                docker compose -f deploy/docker-compose.production.yml ps
REMOTE
            then
              exit 0
            fi

            sleep 20
          done

          echo "Production deployment failed after three attempts" >&2
          exit 1

      - name: Verify public health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 6 --retry-all-errors --retry-delay 10 \
            https://xn--80aaaalzch0asjh0a0a.xn--p1acf/api/health
